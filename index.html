<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Luau Script Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">📜</div>
                <span>Luau Studio</span>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active">
                    <span>⚡</span> Script Generator
                </button>
            </nav>
            <div class="sidebar-footer">
                <span class="status-dot"></span> Luau Engine Active
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <section class="tab-section active">
                <header class="section-header">
                    <h1>Roblox Luau Script Generator</h1>
                    <p>Build production-ready Roblox Studio scripts instantly from custom prompts and game mechanics.</p>
                </header>

                <div class="script-grid">
                    <!-- Control Panel -->
                    <div class="control-panel card">
                        <h3>Script Parameters</h3>
                        
                        <div class="input-group">
                            <label>Script Template Category</label>
                            <select id="scriptType" onchange="updateDefaultPrompt()">
                                <option value="zombie">Zombie Kill-Tracking Leaderboard</option>
                                <option value="mm2">Murder Mystery 2 Role Shuffler & Map Voting</option>
                                <option value="simulator">Simulator Clicker & Multiplier System</option>
                                <option value="gui">Dark-Themed Sidebar & HUD GUI Toggle</option>
                                <option value="combat">Custom Free-for-All Combat & Overhead Health</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Custom Instructions / Prompt</label>
                            <textarea id="scriptPrompt" rows="5" placeholder="e.g. Add a 2x coin multiplier event toggle and save stats automatically..."></textarea>
                        </div>

                        <button class="btn-primary" onclick="generateLuauScript()">⚡ Generate Luau Script</button>
                    </div>

                    <!-- Code Output Panel -->
                    <div class="preview-panel card">
                        <div class="code-header">
                            <h3>Output Script.lua</h3>
                            <div class="code-actions">
                                <button class="btn-secondary" onclick="copyScript()">📋 Copy Code</button>
                                <button class="btn-secondary" onclick="downloadScript()">💾 Save .lua</button>
                            </div>
                        </div>
                        <pre><code id="scriptOutput" class="language-lua">-- Click "Generate Luau Script" to build your script</code></pre>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
